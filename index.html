<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threaded Tales | Our Story</title>
    <style>
        :root {
            --baby-pink: #F4C2C2;
            --deep-pink: #ef9a9a;
            --soft-cream: #FFFaf0;
            --text-grey: #444;
            --white-glass: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--soft-cream);
            color: var(--text-grey);
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* ENHANCEMENT: Glassmorphism Nav */
        nav {
            position: fixed;
            top: 0; width: 100%;
            background-color: var(--white-glass);
            backdrop-filter: blur(10px); /* Blurs the background behind nav */
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
            z-index: 1000;
        }

        nav a {
            text-decoration: none;
            color: var(--text-grey);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        nav a:hover { color: var(--deep-pink); }

        .cart-link {
            background: var(--deep-pink);
            padding: 6px 18px;
            border-radius: 50px;
            color: white !important;
            box-shadow: 0 4px 10px rgba(239, 154, 154, 0.3);
        }

        header {
            background-color: var(--baby-pink);
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 60px;
            clip-path: ellipse(100% 100% at 50% 0%); /* Subtle curved bottom */
        }

        .logo-image { 
            height: 120px; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            transition: 0.5s ease;
        }
        .logo-image:hover { transform: scale(1.1) rotate(5deg); }

        .story-section {
            padding: 100px 15%;
            text-align: center;
            background-color: white;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            padding: 60px 10%;
        }

        .product-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.03);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }

        /* ENHANCEMENT: Card Hover Effect */
        .product-card:hover { 
            transform: translateY(-15px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .image-placeholder, img {
            width: 100%; height: 260px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .product-price { font-size: 22px; font-weight: 800; color: var(--deep-pink); }
        .product-price strike { font-size: 14px; color: #bbb; font-weight: 400; }

        /* SIDEBAR & MODAL */
        .modal, .cart-sidebar {
            /* Styles remain largely the same for functionality */
            display: none; position: fixed; z-index: 2000;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center;
        }
        .cart-sidebar {
            display: flex; right: -400px; width: 350px; background: white; 
            transition: 0.5s; padding: 40px; flex-direction: column;
        }
        .cart-sidebar.active { right: 0; }

        .btn {
            display: inline-block; padding: 15px 30px; background: var(--deep-pink);
            color: white; text-decoration: none; border-radius: 50px;
            font-weight: bold; border: none; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(239, 154, 154, 0.4); }
    </style>
</head>
<body>

    <nav>
        <a href="#story">Our Story</a>
        <a href="#products">Products</a>
        <a href="javascript:void(0)" onclick="toggleCart()" class="cart-link">🛒 My Cart (<span id="cart-count">0</span>)</a>
    </nav>

    <header>
        <img src="your-logo.png" alt="Threaded Tales" class="logo-image">
        <h1 style="letter-spacing: 2px;">Threaded Tales</h1>
        <p style="font-style: italic; opacity: 0.8;">A Yawning Hook waking up to new stories.</p>
    </header>

    <section id="products" class="product-grid">
        <div class="product-card" onclick="openZoom('blanket.jpg', 'Baby Tale Blanket', '₹1200', 'Signature baby pink soft stitch.')">
            <div class="image-placeholder" style="background:#eee">Blanket Photo</div>
            <h3>Baby Tale Blanket</h3>
            <span class="product-price">₹1,200</span>
        </div>
        </section>

    <div id="productModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()" style="background:white; padding:40px; border-radius:30px; text-align:center; max-width:400px;">
            <h2 id="modalTitle"></h2>
            <p id="modalPrice" class="product-price"></p>
            <button class="btn" onclick="addToCart()">Add to Basket</button>
        </div>
    </div>

    <div id="thanksModal" class="modal">
        <div class="modal-content" style="background:white; padding:40px; border-radius:30px; text-align:center;">
            <h2>✨ Order Ready! ✨</h2>
            <p>Order ID: <strong id="orderID"></strong></p>
            <p>Redirecting to WhatsApp to complete your purchase...</p>
            <button class="btn" id="confirmWhatsApp">Open WhatsApp</button>
        </div>
    </div>

    <div id="cartSidebar" class="cart-sidebar">
        <h2>Your Basket</h2>
        <div id="cartItemsList" style="flex-grow:1"></div>
        <div style="font-size:24px; font-weight:bold; margin-bottom:20px;">Total: ₹<span id="cartTotal">0</span></div>
        <button class="btn" style="background:#333" onclick="showThanks()">Checkout Now</button>
    </div>

    <script>
        let cart = [];
        let currentItem = {};

        function openZoom(img, title, price, desc) {
            currentItem = { title, price: parseInt(price.replace('₹','').replace(',','')), rawPrice: price };
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('productModal').style.display = 'none'; }
        function toggleCart() { document.getElementById('cartSidebar').classList.toggle('active'); }

        function addToCart() {
            cart.push(currentItem);
            updateUI();
            closeModal();
            toggleCart();
        }

        function updateUI() {
            const list = document.getElementById('cartItemsList');
            let total = 0;
            list.innerHTML = "";
            cart.forEach((item, i) => {
                total += item.price;
                list.innerHTML += `<p>${item.title} - ₹${item.price} <span onclick="cart.splice(${i},1); updateUI()" style="color:red; cursor:pointer; font-size:10px;">[Remove]</span></p>`;
            });
            document.getElementById('cartTotal').innerText = total;
            document.getElementById('cart-count').innerText = cart.length;
        }

        function showThanks() {
            if(cart.length === 0) return;
            // ENHANCEMENT: Generate Order ID
            const id = "TT-" + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('orderID').innerText = id;
            
            let message = `*Order ${id}*%0A---%0A`;
            cart.forEach(item => message += `- ${item.title}%0A`);
            message += `%0A*Total:* ₹${document.getElementById('cartTotal').innerText}`;
            
            const url = `https://wa.me/911234567890?text=${message}`;
            
            document.getElementById('thanksModal').style.display = 'flex';
            document.getElementById('confirmWhatsApp').onclick = () => { window.open(url, '_blank'); };
        }
    </script>
</body>
</html>
